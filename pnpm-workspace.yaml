packages:
  - packages/*
  - tooling/*

catalogs:
  testing:
    '@vitest/coverage-v8': ^5.0.5
    '@vitest/ui': ^5.0.5
    vitest: ^5.0.5

  tooling:
    '@changesets/cli': ^2.31.1
    '@commitlint/cli': ^21.2.4
    '@commitlint/config-conventional': ^21.2.4
    '@types/node': ^26.6.5
    eslint: ^10.11.0
    glob: ^13.0.6
    husky: ^9.1.7
    lint-staged: ^17.6.0
    prettier: ^3.9.10
    rimraf: ^6.1.3
    tsdown: ^0.23.1
    tsx: ^4.23.15
    turbo: ^2.11.10
    typescript: ^6.0.3
    unrun: ^0.3.1

  pixpilot:
    '@pixpilot/dev-config': ^3.22.1
    '@pixpilot/eslint-config': ^3.0.0
    '@pixpilot/tsdown-config': ^0.8.3
    '@pixpilot/workspace-package-generator': ^2.1.2

overrides:
  '@types/node': catalog:tooling
